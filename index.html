<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>調整提案ボード</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #f6f4ee; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  .msg { font: 15px/1.7 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 16px 20px;
    border: 2px solid #1d2129; border-radius: 12px; background: #fff; color: #1d2129; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #16181d; }
    .msg { background: #1f2229; color: #e8e6e1; border-color: #e8e6e1; }
  }
</style>
</head>
<body>
<script>
// 入口ページ: アプリ(Google Apps Script の画面)を、このページとして表示するだけ。データ・アプリの URL はここに置かない。
// - アプリの番号(デプロイ ID)は URL の # の後ろ(#d=…)で受け取る(# の後ろはサーバに送られない)
// - ?as=… などの欄は、そのままアプリに渡す(アプリの中のボタンは、この入口ページの URL で開き直す)
// - 画面は fetch で受け取る(?raw=1 → { html })。fetch は Google のログイン情報(Cookie)を付けない(credentials: 'omit')ので、
//   ブラウザが Google にログインしていても、Google には「ログインなし」で届く。
//   (以前は iframe で開いていたが、Google にログインしている iPhone の Safari で Google のログインを求められた。2026-10-20)
// - 書き込みも同じく fetch で送る(下の useFetchForWrites が google.script.run の代わりをする。受け側は GAS の doPost)
// - 受け取れなかったとき(アプリが古い・通信の形が変わった)は、以前と同じく iframe で開く
(function () {
  'use strict';
  var m = /(?:^#|&)d=([A-Za-z0-9_-]{20,200})(?:&|$)/.exec(location.hash);
  if (!m) {
    say('URL が正しくありません。送られてきた URL を、最後(# の後ろ)まで含めて開いてください。');
    return;
  }
  var exec = 'https://script.google.com/macros/s/' + m[1] + '/exec';
  var wait = say('読み込んでいます…(はじめは 10 秒ほどかかることがあります)');

  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
  fetch(exec + (location.search ? location.search + '&' : '?') + 'raw=1', {
    credentials: 'omit', cache: 'no-store', signal: ctl ? ctl.signal : undefined,
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (j) {
    if (!j || typeof j.html !== 'string') throw new Error('形が違います');
    clearTimeout(timer);
    show(j.html);
  }).catch(function () {
    clearTimeout(timer);
    frame();
  });

  function say(text) {
    var p = document.createElement('p');
    p.className = 'msg';
    p.setAttribute('role', 'status');
    p.textContent = text;
    document.body.appendChild(p);
    return p;
  }

  // 受け取った画面を、このページとして表示する(書き込み用の google.script.run と、Referer を送らない設定を先頭に足す)
  function show(html) {
    var head = '<meta name="referrer" content="no-referrer"><script>(' + useFetchForWrites.toString() + ')(' + JSON.stringify(exec) + ');<\/script>';
    var at = /<head(\s[^>]*)?>/i.exec(html);
    var page = at ? html.slice(0, at.index + at[0].length) + head + html.slice(at.index + at[0].length) : head + html;
    document.open();
    document.write(page);
    document.close();
  }

  // 以前の開き方(iframe)。fetch で受け取れなかったときだけ
  function frame() {
    if (wait.parentNode) wait.parentNode.removeChild(wait);
    var f = document.createElement('iframe');
    f.src = exec + location.search;
    f.title = '調整提案ボード';
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
  }

  // google.script.run の代わり(画面が使う書き込み 4 つだけ)。表示した画面の中で動く(この関数は文字にして埋め込む)
  function useFetchForWrites(url) {
    var API = ['api_addComment', 'api_addComments', 'api_editComment', 'api_deleteComment'];
    function runner(ok, ng) {
      var r = {
        withSuccessHandler: function (f) { return runner(f, ng); },
        withFailureHandler: function (f) { return runner(ok, f); },
      };
      API.forEach(function (fn) {
        r[fn] = function () {
          var fail = function (e) { if (ng) ng(e instanceof Error ? e : new Error(String(e))); };
          fetch(url, {
            method: 'POST', credentials: 'omit', cache: 'no-store',
            // text/plain は「単純なリクエスト」なので、Google 側の事前確認(preflight)が要らない
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ fn: fn, args: Array.prototype.slice.call(arguments) }),
          }).then(function (res) {
            if (!res.ok) throw new Error('通信できませんでした(' + res.status + ')');
            return res.json();
          }).then(function (j) {
            if (j && Object.prototype.hasOwnProperty.call(j, 'value')) { if (ok) ok(j.value); } else fail(new Error(j && j.error ? j.error : '送れませんでした'));
          }, fail);
        };
      });
      return r;
    }
    window.google = { script: { run: runner(null, null) } };
  }
})();
</script>
<noscript><p class="msg">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
