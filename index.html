<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>調整提案ボード</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #f6f4ee; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  .msg { font: 15px/1.7 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 16px 20px;
    border: 2px solid #1d2129; border-radius: 12px; background: #fff; color: #1d2129; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #16181d; }
    .msg { background: #1f2229; color: #e8e6e1; border-color: #e8e6e1; }
  }
</style>
</head>
<body>
<script>
// 入口ページ: アプリ(Google Apps Script の画面)を、このページの中に開くだけ。データ・アプリの URL はここに置かない。
// - アプリの番号(デプロイ ID)は URL の # の後ろ(#d=…)で受け取る(# の後ろはサーバに送られない)
// - ?as=… などの欄は、そのままアプリに渡す(アプリの中のボタンは、この入口ページの URL で開き直す)
// - Google 以外のこのページの中で開くと、Safari は Google のログイン情報を送らないので、
//   Safari が Google にログインしていても開ける(Google の画面を直接開くと「ファイルを開くことができません」になる)
(function () {
  'use strict';
  var m = /(?:^#|&)d=([A-Za-z0-9_-]{20,200})(?:&|$)/.exec(location.hash);
  if (!m) {
    var p = document.createElement('p');
    p.className = 'msg';
    p.textContent = 'URL が正しくありません。送られてきた URL を、最後(# の後ろ)まで含めて開いてください。';
    document.body.appendChild(p);
    return;
  }
  var f = document.createElement('iframe');
  f.src = 'https://script.google.com/macros/s/' + m[1] + '/exec' + location.search;
  f.title = '調整提案ボード';
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
})();
</script>
<noscript><p class="msg">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
